# HenWatch — YOLOv12-S Instance Segmentation (hen-only)
# Derived from YOLOv12 (Tian et al., 2025)
# A2C2f = Area Attention (A2) + C2f-style block aggregation
# This is ultralytics' implementation of the same AreaAttention module
# we defined from scratch in Part 2.

nc: 1  # hen only

scales:
  # [depth_mult, width_mult, max_channels]
  s: [0.50, 0.50, 1024]

# ── Backbone ──
# Stages 0-1: Conv stem (inherited from YOLOv11)
# Stages 2-3: C3k2 (CNN — efficient for low-level features)
# Stages 4-5: A2C2f (Area Attention — our key innovation)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0  — /2   stem
  - [-1, 1, Conv, [128, 3, 2]]         # 1  — /4   stem
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2  — /4   stage 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3  — /8   downsample
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  — /8   stage 3   (P3)
  - [-1, 1, Conv, [512, 3, 2]]         # 5  — /16  downsample
  - [-1, 4, A2C2f, [512, True, 4]]     # 6  — /16  stage 4   (P4) ★ Area Attention
  - [-1, 1, Conv, [1024, 3, 2]]        # 7  — /32  downsample
  - [-1, 4, A2C2f, [1024, True, 1]]    # 8  — /32  stage 5   (P5) ★ Area Attention

# ── Head (PAN/FPN + Segment) ──
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 6], 1, Concat, [1]]                    # 10  — cat P5_up + P4
  - [-1, 2, A2C2f, [512, False, -1]]             # 11  — fuse

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, Concat, [1]]                    # 13  — cat fused + P3
  - [-1, 2, A2C2f, [256, False, -1]]             # 14  — P3 out

  - [-1, 1, Conv, [256, 3, 2]]                   # 15  — downsample
  - [[-1, 11], 1, Concat, [1]]                   # 16  — cat + P4 fused
  - [-1, 2, A2C2f, [512, False, -1]]             # 17  — P4 out

  - [-1, 1, Conv, [512, 3, 2]]                   # 18  — downsample
  - [[-1, 8], 1, Concat, [1]]                    # 19  — cat + P5
  - [-1, 2, C3k2, [1024, True]]                  # 20  — P5 out

  - [[14, 17, 20], 1, Segment, [nc, 32, 256]]    # 21  — Segment head
