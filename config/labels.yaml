name: "Poultry Pose"
version: "2.0"

classes:
  0: hen

# Index 2 (back_neck) is the painted identification spot — ReID anchor
keypoints:
  - name: beak
    color: "#E63946"
  - name: crown
    color: "#F4A261"
  - name: back_neck
    color: "#E9C46A"   # painted spot ★
  - name: middle_back
    color: "#52B788"
  - name: tail_base
    color: "#4895EF"
  - name: tail_tip
    color: "#ADE8F4"
  - name: left_hock
    color: "#FF9F1C"
  - name: left_foot
    color: "#FFBF69"
  - name: right_hock
    color: "#9B5DE5"
  - name: right_foot
    color: "#C77DFF"

skeleton:
  - [beak, crown]
  - [beak, back_neck]
  - [back_neck, middle_back]
  - [middle_back, tail_base]
  - [tail_base, tail_tip]
  - [tail_base, left_hock]
  - [tail_base, right_hock]
  - [middle_back, left_hock]
  - [middle_back, right_hock]
  - [left_hock, left_foot]
  - [right_hock, right_foot]

flip_pairs:
  - [left_hock, right_hock]
  - [left_foot, right_foot]
